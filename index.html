<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complexity Analyzer — Static Analysis Engine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap');

  :root {
    --bg:        #0a0c10;
    --surface:   #111318;
    --border:    #1e2230;
    --accent:    #00e5a0;
    --accent2:   #6c63ff;
    --danger:    #ff4d6d;
    --warn:      #ffb703;
    --text:      #e2e8f0;
    --muted:     #5a6480;
    --card:      #13161f;
    --glow:      0 0 24px rgba(0,229,160,0.15);
    --glow2:     0 0 24px rgba(108,99,255,0.15);
    --radius:    10px;
    --font-mono: 'JetBrains Mono', monospace;
    --font-ui:   'Syne', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ── Grid background ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,229,160,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,160,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Header ── */
  header {
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,12,16,0.85);
    backdrop-filter: blur(12px);
  }

  .logo {
    display: flex; align-items: center; gap: 12px;
    font-size: 1.1rem; font-weight: 700; letter-spacing: 0.02em;
  }
  .logo-icon {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem;
  }
  .logo span { color: var(--accent); }

  .header-badge {
    font-family: var(--font-mono);
    font-size: 0.65rem; font-weight: 500;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
  .header-badge b { color: var(--accent); }

  /* ── Main layout ── */
  main {
    position: relative; z-index: 1;
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 0;
    height: calc(100vh - 65px);
  }

  /* ── Left panel ── */
  .left-panel {
    display: flex; flex-direction: column;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }

  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .panel-title {
    font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .panel-title::before {
    content: ''; width: 6px; height: 6px;
    border-radius: 50%; background: var(--accent);
    display: inline-block;
  }

  /* ── Language selector ── */
  .lang-tabs {
    display: flex; gap: 4px;
  }
  .lang-tab {
    font-family: var(--font-mono);
    font-size: 0.68rem; font-weight: 500;
    padding: 4px 10px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: transparent; color: var(--muted);
    cursor: pointer; transition: all 0.15s;
  }
  .lang-tab:hover { color: var(--text); border-color: var(--muted); }
  .lang-tab.active {
    background: rgba(0,229,160,0.1);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── Editor ── */
  .editor-wrap { flex: 1; position: relative; overflow: hidden; }

  #code-editor {
    width: 100%; height: 100%;
    background: var(--bg);
    color: #c9d1d9;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    line-height: 1.7;
    padding: 20px 20px 20px 52px;
    border: none; outline: none; resize: none;
    tab-size: 2;
    white-space: pre;
    overflow: auto;
  }

  .line-numbers {
    position: absolute; top: 0; left: 0;
    width: 40px; height: 100%;
    padding: 20px 0;
    display: flex; flex-direction: column; align-items: flex-end;
    padding-right: 8px;
    background: var(--bg);
    border-right: 1px solid var(--border);
    overflow: hidden;
    pointer-events: none;
  }
  .line-num {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    line-height: 1.7;
    color: var(--muted);
    min-height: 1.394rem; /* matches line-height of editor */
    opacity: 0.5;
  }

  /* ── Bottom bar ── */
  .bottom-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    gap: 12px;
  }

  .status-row { display: flex; align-items: center; gap: 14px; }
  .status-chip {
    font-family: var(--font-mono); font-size: 0.65rem;
    color: var(--muted);
    display: flex; align-items: center; gap: 5px;
  }

  #analyze-btn {
    font-family: var(--font-ui); font-weight: 700;
    font-size: 0.8rem; letter-spacing: 0.06em;
    padding: 10px 28px;
    background: linear-gradient(135deg, var(--accent), #00c985);
    color: #000;
    border: none; border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 8px;
    position: relative; overflow: hidden;
  }
  #analyze-btn::after {
    content: '';
    position: absolute; inset: 0;
    background: white;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #analyze-btn:hover::after { opacity: 0.12; }
  #analyze-btn:active { transform: scale(0.97); }
  #analyze-btn:disabled {
    opacity: 0.5; cursor: not-allowed;
  }
  #analyze-btn .spinner {
    display: none;
    width: 14px; height: 14px;
    border: 2px solid rgba(0,0,0,0.3);
    border-top-color: #000;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  #analyze-btn.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Right panel ── */
  .right-panel {
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .results-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .results-area::-webkit-scrollbar { width: 4px; }
  .results-area::-webkit-scrollbar-track { background: transparent; }
  .results-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── Empty state ── */
  .empty-state {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; text-align: center;
    color: var(--muted);
    padding: 40px;
  }
  .empty-icon {
    font-size: 2.5rem; opacity: 0.3;
    filter: grayscale(1);
  }
  .empty-state p {
    font-size: 0.8rem; line-height: 1.6;
    max-width: 240px;
  }

  /* ── Complexity cards ── */
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    animation: fadeUp 0.3s ease forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-label {
    font-size: 0.62rem; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
    padding: 10px 14px 6px;
    display: flex; align-items: center; gap: 6px;
  }

  /* ── Big-O Display ── */
  .complexity-display {
    padding: 10px 14px 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .complexity-row {
    display: flex; align-items: center; justify-content: space-between;
  }
  .complexity-case {
    font-family: var(--font-mono); font-size: 0.65rem;
    color: var(--muted); min-width: 80px;
  }
  .complexity-value {
    font-family: var(--font-mono);
    font-size: 1.05rem; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .complexity-value.best  { color: var(--accent); }
  .complexity-value.avg   { color: var(--warn); }
  .complexity-value.worst { color: var(--danger); }
  .complexity-bar {
    height: 3px; flex: 1; max-width: 100px;
    background: var(--border); border-radius: 2px;
    overflow: hidden;
  }
  .complexity-bar-fill {
    height: 100%; border-radius: 2px;
    transition: width 0.6s cubic-bezier(0.34,1.56,0.64,1);
  }
  .best  .complexity-bar-fill { background: var(--accent); }
  .avg   .complexity-bar-fill { background: var(--warn); }
  .worst .complexity-bar-fill { background: var(--danger); }

  /* ── Space complexity ── */
  .space-display {
    padding: 10px 14px 14px;
    display: flex; flex-direction: column; gap: 8px;
  }

  /* ── Patterns ── */
  .patterns-display {
    padding: 8px 14px 14px;
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .pattern-chip {
    font-family: var(--font-mono); font-size: 0.66rem;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid;
    display: flex; align-items: center; gap: 5px;
  }
  .pattern-chip.primary {
    border-color: rgba(108,99,255,0.4);
    background: rgba(108,99,255,0.1);
    color: #a09cff;
  }
  .pattern-chip.secondary {
    border-color: rgba(0,229,160,0.3);
    background: rgba(0,229,160,0.07);
    color: var(--accent);
  }
  .pattern-chip.neutral {
    border-color: var(--border);
    background: transparent;
    color: var(--muted);
  }

  /* ── Explanation ── */
  .explanation-display {
    padding: 10px 14px 14px;
    font-size: 0.78rem; line-height: 1.7;
    color: #94a3b8;
  }

  /* ── Analysis Trace ── */
  .trace-display {
    padding: 8px 14px 14px;
  }
  .trace-line {
    font-family: var(--font-mono); font-size: 0.68rem;
    line-height: 1.9; color: var(--muted);
    display: flex; align-items: baseline; gap: 8px;
  }
  .trace-line .trace-key {
    color: #5a8c9e; min-width: 150px; flex-shrink: 0;
  }
  .trace-line .trace-val { color: var(--text); }
  .trace-line .trace-val.hi { color: var(--accent); }
  .trace-line .trace-val.warn { color: var(--warn); }
  .trace-line .trace-val.err { color: var(--danger); }

  /* ── Recurrence ── */
  .recurrence-display {
    padding: 8px 14px 14px;
    background: rgba(0,0,0,0.3);
    margin: 0 14px 14px;
    border-radius: 7px;
    border: 1px solid var(--border);
  }
  .recurrence-title {
    font-family: var(--font-mono); font-size: 0.6rem;
    color: var(--muted); margin-bottom: 8px;
    letter-spacing: 0.08em;
  }
  .recurrence-eq {
    font-family: var(--font-mono); font-size: 0.8rem;
    color: var(--accent2); line-height: 2;
  }
  .recurrence-arrow {
    font-family: var(--font-mono); font-size: 0.75rem;
    color: var(--muted);
  }
  .recurrence-result {
    font-family: var(--font-mono); font-size: 0.85rem;
    font-weight: 700; color: var(--accent);
  }

  /* ── Error card ── */
  .error-card {
    background: rgba(255,77,109,0.07);
    border: 1px solid rgba(255,77,109,0.25);
    border-radius: var(--radius);
    padding: 14px;
    display: flex; gap: 10px; align-items: flex-start;
    font-size: 0.78rem; color: #fca5a5;
    animation: fadeUp 0.3s ease forwards;
  }

  /* ── Examples ── */
  .examples-panel {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .examples-title {
    font-size: 0.62rem; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 8px;
  }
  .examples-grid {
    display: flex; flex-wrap: wrap; gap: 5px;
  }
  .example-btn {
    font-family: var(--font-mono); font-size: 0.63rem;
    padding: 4px 9px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 5px; color: var(--muted);
    cursor: pointer; transition: all 0.15s;
  }
  .example-btn:hover {
    border-color: var(--accent2);
    color: #a09cff;
  }

  /* ── Scrollbar ── */
  #code-editor::-webkit-scrollbar { width: 5px; height: 5px; }
  #code-editor::-webkit-scrollbar-track { background: transparent; }
  #code-editor::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .divider {
    border: none; border-top: 1px solid var(--border);
    margin: 4px 0;
  }

  /* hidden=false items */
  .hidden { display: none !important; }

  /* perf badge */
  #perf-badge {
    font-family: var(--font-mono); font-size: 0.62rem;
    color: var(--muted);
    transition: color 0.2s;
  }
  #perf-badge.fast { color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">⚡</div>
    Complexity<span>Analyzer</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span id="perf-badge">—</span>
    <span class="header-badge"><b>OFFLINE</b> · STATIC ANALYSIS · DETERMINISTIC</span>
  </div>
</header>

<main>
  <!-- LEFT: Editor -->
  <div class="left-panel">
    <div class="panel-header">
      <span class="panel-title">Source Code</span>
      <div class="lang-tabs" id="lang-tabs">
        <button class="lang-tab active" data-lang="cpp">C++</button>
        <button class="lang-tab" data-lang="java">Java</button>
        <button class="lang-tab" data-lang="python">Python</button>
        <button class="lang-tab" data-lang="javascript">JS</button>
      </div>
    </div>
    <div class="editor-wrap">
      <div class="line-numbers" id="line-numbers"></div>
      <textarea id="code-editor" spellcheck="false" autocomplete="off" autocorrect="off"></textarea>
    </div>
    <div class="bottom-bar">
      <div class="status-row">
        <span class="status-chip">
          <span id="line-count">0</span> lines
        </span>
        <span class="status-chip" id="detect-hint"></span>
      </div>
      <button id="analyze-btn" onclick="runAnalysis()">
        <div class="spinner"></div>
        <span>Analyze</span>
        <span style="opacity:0.6;font-size:0.7rem">▶</span>
      </button>
    </div>
  </div>

  <!-- RIGHT: Results -->
  <div class="right-panel">
    <div class="panel-header">
      <span class="panel-title">Analysis Report</span>
      <span id="func-name-badge" style="font-family:var(--font-mono);font-size:0.65rem;color:var(--muted)"></span>
    </div>

    <div class="results-area" id="results-area">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">🔬</div>
        <p>Paste your code on the left and click <strong>Analyze</strong> to begin static analysis.</p>
      </div>
    </div>

    <div class="examples-panel">
      <div class="examples-title">Quick Examples</div>
      <div class="examples-grid" id="examples-grid"></div>
    </div>
  </div>
</main>

<script>
// ═══════════════════════════════════════════════════════════════
//  COMPLEXITY ANALYZER — DETERMINISTIC STATIC ANALYSIS ENGINE
// ═══════════════════════════════════════════════════════════════

// ── Complexity ordering for Big-O comparison ──────────────────
const COMPLEXITY_ORDER = [
  'O(1)', 'O(log n)', 'O(sqrt(n))', 'O(n)', 'O(n log n)',
  'O(n log² n)', 'O(n²)', 'O(n² log n)', 'O(n³)', 'O(2^n)', 'O(n!)'
];

function complexityRank(c) {
  const i = COMPLEXITY_ORDER.indexOf(c);
  return i === -1 ? 5 : i;
}

// ── Example snippets ───────────────────────────────────────────
const EXAMPLES = [
  {
    label: 'Quick Sort',
    lang: 'cpp',
    code: `int partition(int arr[], int low, int high) {
    int pivot = arr[high];
    int i = low - 1;
    for (int j = low; j < high; j++) {
        if (arr[j] < pivot) {
            i++;
            swap(arr[i], arr[j]);
        }
    }
    swap(arr[i+1], arr[high]);
    return i + 1;
}

void quickSort(int arr[], int low, int high) {
    if (low < high) {
        int pi = partition(arr, low, high);
        quickSort(arr, low, pi - 1);
        quickSort(arr, pi + 1, high);
    }
}`
  },
  {
    label: 'Merge Sort',
    lang: 'cpp',
    code: `void mergeSort(int arr[], int l, int r) {
    if (l < r) {
        int m = l + (r - l) / 2;
        mergeSort(arr, l, m);
        mergeSort(arr, m + 1, r);
        merge(arr, l, m, r);
    }
}`
  },
  {
    label: 'Binary Search',
    lang: 'cpp',
    code: `int binarySearch(int arr[], int low, int high, int target) {
    while (low <= high) {
        int mid = low + (high - low) / 2;
        if (arr[mid] == target) return mid;
        else if (arr[mid] < target) low = mid + 1;
        else high = mid - 1;
    }
    return -1;
}`
  },
  {
    label: 'BFS',
    lang: 'cpp',
    code: `void bfs(int start, vector<vector<int>>& adj) {
    vector<bool> visited(n, false);
    queue<int> q;
    q.push(start);
    visited[start] = true;
    while (!q.empty()) {
        int node = q.front(); q.pop();
        for (int neighbor : adj[node]) {
            if (!visited[neighbor]) {
                visited[neighbor] = true;
                q.push(neighbor);
            }
        }
    }
}`
  },
  {
    label: 'Fibonacci (naive)',
    lang: 'cpp',
    code: `int fib(int n) {
    if (n <= 1) return n;
    return fib(n - 1) + fib(n - 2);
}`
  },
  {
    label: 'Sliding Window',
    lang: 'cpp',
    code: `int maxSumSubarray(int arr[], int n, int k) {
    int maxSum = 0, windowSum = 0;
    for (int i = 0; i < k; i++) windowSum += arr[i];
    maxSum = windowSum;
    for (int i = k; i < n; i++) {
        windowSum += arr[i] - arr[i - k];
        maxSum = max(maxSum, windowSum);
    }
    return maxSum;
}`
  },
  {
    label: 'Bubble Sort',
    lang: 'cpp',
    code: `void bubbleSort(int arr[], int n) {
    for (int i = 0; i < n - 1; i++) {
        for (int j = 0; j < n - i - 1; j++) {
            if (arr[j] > arr[j + 1]) {
                int temp = arr[j];
                arr[j] = arr[j + 1];
                arr[j + 1] = temp;
            }
        }
    }
}`
  },
  {
    label: 'Factorial',
    lang: 'cpp',
    code: `long long factorial(int n) {
    if (n == 0 || n == 1) return 1;
    return n * factorial(n - 1);
}`
  },
  {
    label: 'Power of 2 Loop',
    lang: 'cpp',
    code: `int countSteps(int n) {
    int count = 0;
    for (int i = 1; i < n; i *= 2) {
        count++;
    }
    return count;
}`
  },
  {
    label: 'DFS',
    lang: 'python',
    code: `def dfs(node, graph, visited):
    visited.add(node)
    for neighbor in graph[node]:
        if neighbor not in visited:
            dfs(neighbor, graph, visited)`
  }
];

// ═══════════════════════════════════════════════════════════════
//  TOKENIZER — language-aware
// ═══════════════════════════════════════════════════════════════
function tokenize(code, lang) {
  // Strip comments
  let clean = code;
  if (lang === 'python') {
    clean = clean.replace(/#[^\n]*/g, '');
    clean = clean.replace(/"""[\s\S]*?"""/g, '""');
    clean = clean.replace(/'''[\s\S]*?'''/g, "''");
  } else {
    clean = clean.replace(/\/\/[^\n]*/g, '');
    clean = clean.replace(/\/\*[\s\S]*?\*\//g, '');
  }
  // Strip string literals
  clean = clean.replace(/"(?:[^"\\]|\\.)*"/g, '""');
  clean = clean.replace(/'(?:[^'\\]|\\.)*'/g, "''");
  return clean;
}

// ═══════════════════════════════════════════════════════════════
//  AST-LITE: structural extraction
// ═══════════════════════════════════════════════════════════════
function extractStructure(code, lang) {
  const clean = tokenize(code, lang);
  const lines = clean.split('\n');

  const fns = [];
  const loops = [];
  const recursiveCalls = {};
  const dataStructures = new Set();

  // ── Function detection ────────────────────────────────────────
  const FN_PATTERNS = {
    cpp:        /(?:void|int|long|bool|double|float|auto|string|vector|char|unsigned)\s+(\w+)\s*\(([^)]*)\)/,
    java:       /(?:public|private|protected|static|void|int|long|boolean|double|String)[\s\w<>\[\]]*\s+(\w+)\s*\(([^)]*)\)/,
    python:     /def\s+(\w+)\s*\(([^)]*)\)/,
    javascript: /(?:function\s+(\w+)|(?:const|let|var)\s+(\w+)\s*=\s*(?:async\s*)?\([^)]*\)\s*=>|(?:const|let|var)\s+(\w+)\s*=\s*function)/,
  };

  const fnPat = FN_PATTERNS[lang] || FN_PATTERNS.cpp;

  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(fnPat);
    if (m) {
      const name = m[1] || m[2] || m[3];
      if (name && !['if','while','for','switch','return','else'].includes(name)) {
        fns.push({ name, lineStart: i, lineEnd: -1 });
      }
    }
  }

  // Assign function end lines
  for (let f = 0; f < fns.length; f++) {
    fns[f].lineEnd = f + 1 < fns.length ? fns[f + 1].lineStart - 1 : lines.length - 1;
  }

  // ── Loop detection ────────────────────────────────────────────
  // Track nesting depth
  function getLoopNesting(lineIdx, allLoops) {
    let depth = 0;
    for (const l of allLoops) {
      if (l.lineStart < lineIdx && l.lineEnd > lineIdx) depth++;
    }
    return depth;
  }

  const LOOP_PAT_CPP  = /\b(for|while)\b\s*\(/;
  const LOOP_PAT_PY   = /^\s*(for|while)\b/;

  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    const isLoop = lang === 'python' ? LOOP_PAT_PY.test(ln) : LOOP_PAT_CPP.test(ln);
    if (!isLoop) continue;

    // Detect loop type
    let loopKind = 'linear'; // default
    let stepNote = '';

    // Halving/doubling?
    if (/i\s*[\*\/]=\s*2|i\s*=\s*i\s*[\*\/]\s*2|i\s*>>=\s*1|i\s*<<=\s*1/.test(ln) ||
        />>|i\s*=\s*\w+\s*\/\s*2|mid/.test(ln)) {
      loopKind = 'logarithmic';
      stepNote = 'i *= 2 or halving step → O(log n)';
    }

    // Estimate end line (brace matching for C-family, indent for Python)
    let endLine = i + 1;
    if (lang === 'python') {
      const baseIndent = ln.match(/^\s*/)[0].length;
      for (let j = i + 1; j < lines.length; j++) {
        const jl = lines[j].trim();
        if (jl === '') continue;
        const jIndent = lines[j].match(/^\s*/)[0].length;
        if (jIndent <= baseIndent) { endLine = j - 1; break; }
        endLine = j;
      }
    } else {
      let depth = 0; let found = false;
      for (let j = i; j < lines.length; j++) {
        for (const ch of lines[j]) {
          if (ch === '{') depth++;
          if (ch === '}') { depth--; if (depth === 0) { endLine = j; found = true; break; } }
        }
        if (found) break;
      }
    }

    loops.push({ lineStart: i, lineEnd: endLine, kind: loopKind, stepNote });
  }

  // Assign nesting depth to each loop
  for (const loop of loops) {
    loop.depth = 1;
    for (const other of loops) {
      if (other === loop) continue;
      if (other.lineStart < loop.lineStart && other.lineEnd > loop.lineEnd) {
        loop.depth++;
      }
    }
  }

  // ── Recursive call detection ───────────────────────────────────
  for (const fn of fns) {
    const body = lines.slice(fn.lineStart, fn.lineEnd + 1).join('\n');
    // Find all calls to this function
    const callPat = new RegExp('\\b' + fn.name + '\\s*\\(', 'g');
    let matches = [...body.matchAll(callPat)];
    // Exclude the function definition itself (first occurrence is the def)
    const defIdx = body.search(callPat);
    const callCount = matches.length > 0 ? matches.length - 1 : 0;

    if (callCount > 0) {
      recursiveCalls[fn.name] = callCount;
    }
  }

  // ── Data structure detection ──────────────────────────────────
  const DS_PATTERNS = [
    { pat: /\bqueue\b|\.push\b|\.pop\b|\.front\b|deque|ArrayDeque/i,  name: 'queue' },
    { pat: /\bstack\b|\.top\(\)|\.push\(|Stack</i,                    name: 'stack' },
    { pat: /\bmap\b|HashMap|unordered_map|dict\b|\{\}/,               name: 'map' },
    { pat: /\bset\b|HashSet|unordered_set/i,                          name: 'set' },
    { pat: /\bvector\b|ArrayList|list\b|\[\]/,                        name: 'array' },
    { pat: /\bvisited\b/,                                             name: 'visited-array' },
    { pat: /\bdp\b|\bmemo\b|\bcache\b/i,                             name: 'dp-table' },
    { pat: /priority_queue|PriorityQueue|heapq/i,                    name: 'heap' },
  ];
  for (const { pat, name } of DS_PATTERNS) {
    if (pat.test(code)) dataStructures.add(name);
  }

  return { fns, loops, recursiveCalls, dataStructures, lines, clean };
}

// ═══════════════════════════════════════════════════════════════
//  PATTERN DETECTOR
// ═══════════════════════════════════════════════════════════════
function detectPatterns(code, struct, lang) {
  const { loops, recursiveCalls, dataStructures, fns } = struct;
  const detected = new Set();
  const trace = [];

  // ── Sliding Window ────────────────────────────────────────────
  if (/sliding.window|windowSum|window_sum|\bi\s*-\s*k\b|\bleft\b.*\bright\b/i.test(code) ||
      (loops.length >= 1 &&
       /left|right|start|end|window/i.test(code) &&
       !Object.keys(recursiveCalls).length)) {
    // Only flag if no nested O(n²) structure
    const maxDepth = loops.reduce((m,l) => Math.max(m, l.depth), 0);
    if (maxDepth <= 1 || /windowSum|window_sum/.test(code)) {
      detected.add('Sliding Window');
    }
  }

  // ── Two Pointer ───────────────────────────────────────────────
  if (/\bleft\b.*\bright\b|\blow\b.*\bhigh\b|\bstart\b.*\bend\b/i.test(code) &&
      !Object.keys(recursiveCalls).length) {
    detected.add('Two Pointer');
  }

  // ── Binary Search ─────────────────────────────────────────────
  if (/\bmid\b.*=.*\blow\b|\bmid\b.*=.*\bhigh\b|mid\s*=\s*\(low\s*\+\s*high\)|mid\s*=\s*l\s*\+\s*\(r\s*-\s*l\)\s*\/\s*2/i.test(code)) {
    detected.add('Binary Search');
    trace.push({ key: 'Midpoint halving', val: 'detected', cls: 'hi' });
  }

  // ── Graph Traversal patterns ──────────────────────────────────
  const hasVisited = dataStructures.has('visited-array');
  const hasQueue   = dataStructures.has('queue');
  const hasStack   = dataStructures.has('stack');

  if (hasQueue && hasVisited) {
    detected.add('BFS');
    trace.push({ key: 'BFS pattern', val: 'queue + visited → O(V+E)', cls: 'hi' });
  }
  if ((hasStack || Object.keys(recursiveCalls).length > 0) && hasVisited &&
      /\bneighbor\b|\badj\b|\bgraph\b|\bedge\b/i.test(code)) {
    detected.add('DFS');
    trace.push({ key: 'DFS pattern', val: 'recursion/stack + visited + graph', cls: 'hi' });
  }

  // ── DP / Memoization ─────────────────────────────────────────
  if (dataStructures.has('dp-table')) {
    detected.add('Dynamic Programming');
    trace.push({ key: 'DP table/memo', val: 'detected', cls: 'hi' });
  }

  // ── Recursion patterns ────────────────────────────────────────
  for (const [fnName, callCount] of Object.entries(recursiveCalls)) {
    trace.push({ key: 'Recursive function', val: fnName, cls: 'hi' });
    trace.push({ key: 'Recursive calls/frame', val: String(callCount) });

    if (callCount >= 2) {
      // Check for divide-and-conquer indicators
      const fnData = fns.find(f => f.name === fnName);
      const body = fnData
        ? struct.lines.slice(fnData.lineStart, fnData.lineEnd + 1).join('\n')
        : code;

      const hasPartition = /partition|pivot/i.test(body);
      const hasMidpoint  = /mid\s*=|\/\s*2/.test(body);
      const hasHalving   = hasMidpoint || /\bleft\b.*\bright\b|\blo\b.*\bhi\b/i.test(body) || hasPartition;

      if (hasHalving || callCount === 2) {
        detected.add('Divide and Conquer');
        detected.add('Recursive Sorting / Search');
        if (hasPartition) {
          detected.add('Partition-based Recursion');
          trace.push({ key: 'Partition pivot', val: 'detected → Quick Sort pattern', cls: 'hi' });
        }
        if (loops.some(l => l.lineStart >= (fnData?.lineStart || 0) && l.lineStart <= (fnData?.lineEnd || Infinity))) {
          detected.add('Nested Iteration inside Recursion');
          trace.push({ key: 'Loop inside recursion', val: 'detected', cls: 'warn' });
        }
      } else {
        detected.add('Binary Recursion');
        trace.push({ key: 'Recurrence', val: 'T(n) = 2T(n-1) + O(1) → O(2ⁿ)', cls: 'warn' });
      }
    } else if (callCount === 1) {
      // Is it tree / graph DFS or linear?
      if (hasVisited && /\bneighbor\b|\badj\b|\bgraph\b/i.test(code)) {
        detected.add('DFS');
      } else {
        detected.add('Linear Recursion');
        trace.push({ key: 'Recurrence', val: 'T(n) = T(n-1) + O(1) → O(n)', cls: '' });
      }
    }
  }

  // ── Backtracking ─────────────────────────────────────────────
  if (/backtrack|permut|subset|nqueen/i.test(code)) {
    detected.add('Backtracking');
  }

  return { detected: [...detected], trace };
}

// ═══════════════════════════════════════════════════════════════
//  COMPLEXITY CALCULATOR
// ═══════════════════════════════════════════════════════════════
function calcComplexity(code, struct, patterns, lang) {
  const { loops, recursiveCalls, dataStructures, fns } = struct;
  const detected = new Set(patterns.detected);

  let best = 'O(1)', avg = 'O(1)', worst = 'O(1)';
  let space = 'O(1)';
  let recurrenceEq = '', recurrenceResult = '';
  const explanation = [];

  // ── Graph traversal → O(V+E) ──────────────────────────────────
  if (detected.has('BFS') || detected.has('DFS')) {
    best = avg = worst = 'O(V+E)';
    space = detected.has('BFS') ? 'O(V)' : 'O(V)';
    explanation.push('Graph traversal visits each vertex and edge exactly once.');
    recurrenceEq = 'Each node visited once, each edge relaxed once';
    recurrenceResult = 'O(V + E)';
  }

  // ── Pure recursion analysis ───────────────────────────────────
  else if (Object.keys(recursiveCalls).length > 0) {
    const maxCalls = Math.max(...Object.values(recursiveCalls));

    if (detected.has('Divide and Conquer')) {
      const hasPartition = detected.has('Partition-based Recursion');
      const hasLoopInside = detected.has('Nested Iteration inside Recursion');

      if (hasPartition) {
        // Quick Sort
        best  = 'O(n log n)';
        avg   = 'O(n log n)';
        worst = 'O(n²)';
        space = 'O(log n)'; // avg call stack
        recurrenceEq = 'T(n) = T(k) + T(n−k−1) + O(n)';
        recurrenceResult = 'Avg O(n log n) · Worst O(n²)';
        explanation.push(
          'Divide and conquer with two recursive calls and a partition loop.',
          'Each recursive step partitions around a pivot in O(n) time.',
          'Average: balanced split → T(n) = 2T(n/2) + O(n) → O(n log n).',
          'Worst case: always-bad pivot (sorted input) → T(n) = T(n−1) + O(n) → O(n²).',
          'Call stack depth: O(log n) average, O(n) worst.'
        );
      } else if (hasLoopInside || detected.has('Recursive Sorting / Search')) {
        // Merge Sort style
        best = avg = worst = 'O(n log n)';
        space = 'O(n)';
        recurrenceEq = 'T(n) = 2T(n/2) + O(n)';
        recurrenceResult = 'O(n log n)  [Master Theorem case 2]';
        explanation.push(
          'Two recursive calls on half-size subproblems with O(n) merge/work.',
          'Master Theorem: a=2, b=2, f(n)=O(n) → O(n log n).'
        );
      } else {
        best = avg = worst = 'O(n log n)';
        space = 'O(log n)';
        recurrenceEq = 'T(n) = 2T(n/2) + O(n)';
        recurrenceResult = 'O(n log n)';
        explanation.push('Divide and conquer with two recursive calls on halved subproblems.');
      }
    } else if (detected.has('Binary Recursion')) {
      // e.g. fib naive
      best = avg = worst = 'O(2^n)';
      space = 'O(n)';
      recurrenceEq = 'T(n) = 2T(n−1) + O(1)';
      recurrenceResult = 'O(2ⁿ)';
      explanation.push(
        'Two recursive calls with linear depth → exponential growth.',
        'Each level doubles the number of calls.'
      );
    } else if (detected.has('Linear Recursion')) {
      best = avg = worst = 'O(n)';
      space = 'O(n)';
      recurrenceEq = 'T(n) = T(n−1) + O(1)';
      recurrenceResult = 'O(n)';
      explanation.push('Single recursive call reduces problem size by 1 each step.');
    } else if (detected.has('DFS')) {
      best = avg = worst = 'O(V+E)';
      space = 'O(V)';
      explanation.push('Recursive DFS visits each vertex and edge once.');
    } else if (detected.has('Backtracking')) {
      best  = 'O(n)';
      avg   = 'O(n!)';
      worst = 'O(n!)';
      space = 'O(n)';
      explanation.push('Backtracking explores all permutations in worst case.');
    }
  }

  // ── Loop-based analysis ───────────────────────────────────────
  else if (loops.length > 0) {
    const maxDepth = loops.reduce((m, l) => Math.max(m, l.depth), 0);
    const hasLogLoop = loops.some(l => l.kind === 'logarithmic');
    const hasLinearLoop = loops.some(l => l.kind === 'linear');

    if (detected.has('Binary Search')) {
      best  = 'O(1)';
      avg   = 'O(log n)';
      worst = 'O(log n)';
      space = 'O(1)';
      explanation.push('Halves the search space each iteration → O(log n).');
    } else if (detected.has('Sliding Window') && maxDepth <= 1) {
      best = avg = worst = 'O(n)';
      space = 'O(1)';
      explanation.push(
        'Single pass with a sliding window.',
        'Each element enters and leaves the window at most once → O(n) amortized.'
      );
    } else if (hasLogLoop && maxDepth === 1) {
      best = avg = worst = 'O(log n)';
      space = 'O(1)';
      explanation.push('Loop step doubles/halves → logarithmic iterations.');
    } else if (hasLogLoop && maxDepth === 2) {
      best = avg = worst = 'O(n log n)';
      space = 'O(1)';
      explanation.push('Outer linear loop, inner logarithmic loop → O(n log n).');
    } else if (maxDepth === 1) {
      best = avg = worst = 'O(n)';
      space = 'O(1)';
      explanation.push('Single loop iterates over n elements → O(n).');
    } else if (maxDepth === 2) {
      best  = 'O(n)';
      avg   = 'O(n²)';
      worst = 'O(n²)';
      // Check amortized: queue/stack processed once → still O(n)
      if ((dataStructures.has('queue') || dataStructures.has('stack')) &&
          /\.empty\(\)|\.isEmpty\(\)/.test(code)) {
        best = avg = worst = 'O(n)';
        space = 'O(n)';
        explanation.push(
          'Appears nested, but each element is enqueued/dequeued at most once.',
          'Amortized analysis: total operations = O(n), not O(n²).',
          'Queue processes each element exactly once → O(n) amortized.'
        );
      } else {
        space = 'O(1)';
        explanation.push('Two nested loops → O(n²).');
      }
    } else if (maxDepth >= 3) {
      worst = 'O(n³)';
      avg   = 'O(n³)';
      best  = 'O(n²)';
      space = 'O(1)';
      explanation.push(`${maxDepth}-level nested loops → O(n^${maxDepth}).`);
      worst = `O(n^${maxDepth})`;
      avg   = `O(n^${maxDepth})`;
    }
  }

  // ── Data structure space ──────────────────────────────────────
  if (dataStructures.has('dp-table')) {
    space = 'O(n)';
    if (detected.has('Dynamic Programming')) {
      explanation.push('DP table uses O(n) or O(n²) space depending on dimensions.');
    }
  }
  if (dataStructures.has('heap')) {
    space = space === 'O(1)' ? 'O(n)' : space;
  }

  return { best, avg, worst, space, explanation: explanation.join(' '), recurrenceEq, recurrenceResult };
}

// ═══════════════════════════════════════════════════════════════
//  SPACE COMPLEXITY ESTIMATOR
// ═══════════════════════════════════════════════════════════════
function estimateSpace(code, struct, time) {
  // Already computed in calcComplexity, but let's refine
  return time.space;
}

// ═══════════════════════════════════════════════════════════════
//  MAIN ANALYSIS ENTRY
// ═══════════════════════════════════════════════════════════════
function analyze(code, lang) {
  const t0 = performance.now();

  if (!code.trim()) return null;

  const struct   = extractStructure(code, lang);
  const patterns = detectPatterns(code, struct, lang);
  const time     = calcComplexity(code, struct, patterns, lang);

  // Compose pattern label
  let patternLabel = patterns.detected
    .filter(p => !['Recursive Sorting / Search'].includes(p))
    .join(' + ') || 'Iterative';

  // Remove conflicting false-positive patterns
  const toRemove = [];
  if (patterns.detected.includes('Divide and Conquer')) {
    toRemove.push('Sliding Window', 'Linear Recursion', 'Two Pointer');
  }
  if (patterns.detected.includes('BFS') || patterns.detected.includes('DFS')) {
    toRemove.push('Sliding Window');
  }
  const cleanPatterns = patterns.detected.filter(p => !toRemove.includes(p));

  const elapsed = performance.now() - t0;

  return {
    time_complexity: {
      best:  time.best,
      avg:   time.avg,
      worst: time.worst,
    },
    space_complexity: { avg: time.space },
    patterns: cleanPatterns,
    explanation: time.explanation || 'Analyzed using static control-flow rules.',
    recurrenceEq: time.recurrenceEq,
    recurrenceResult: time.recurrenceResult,
    trace: patterns.trace,
    fns: struct.fns.map(f => f.name),
    loopCount: struct.loops.length,
    maxLoopDepth: struct.loops.reduce((m, l) => Math.max(m, l.depth), 0),
    elapsed: elapsed.toFixed(2),
  };
}

        <div class="trace-line">
          <span class="trace-key">${escHtml(t.key)}</span>
          <span class="trace-val ${t.cls || ''}">${escHtml(String(t.val))}</span>
        </div>`).join('')}
    </div>`;
  area.appendChild(trCard);

  // Perf
  const pb = document.getElementById('perf-badge');
  pb.textContent = result.elapsed + 'ms';
  pb.className = parseFloat(result.elapsed) < 5 ? 'fast' : '';
}

function patternIcon(p) {
  const icons = {
    'Divide and Conquer': '⚔️',
    'Partition-based Recursion': '🔪',
    'Quick Sort': '⚡',
    'Merge Sort': '🔀',
    'Binary Search': '🔍',
    'BFS': '🌊',
    'DFS': '🌲',
    'Sliding Window': '🪟',
    'Two Pointer': '👉',
    'Dynamic Programming': '🧠',
    'Linear Recursion': '📏',
    'Binary Recursion': '🌳',
    'Backtracking': '↩️',
    'Nested Iteration inside Recursion': '🔁',
    'Recursive Sorting / Search': '🔃',
  };
  return icons[p] || '◆';
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function renderError(msg) {
  const area = document.getElementById('results-area');
  area.innerHTML = `<div class="error-card">⚠️ <span>${escHtml(msg)}</span></div>`;
}

// ═══════════════════════════════════════════════════════════════
//  RUN ANALYSIS
// ═══════════════════════════════════════════════════════════════
function runAnalysis() {
  const code = document.getElementById('code-editor').value;
  const btn  = document.getElementById('analyze-btn');

  if (!code.trim()) {
    renderError('No code to analyze. Paste some code first.');
    return;
  }

  btn.disabled = true;
  btn.classList.add('loading');

  // Tiny delay so spinner renders
  setTimeout(() => {
    try {
      const result = analyze(code, currentLang);
      if (!result) { renderError('Could not parse code structure.'); return; }

      document.getElementById('empty-state')?.remove();
      renderResult(result);

      // Function badge
      const badge = document.getElementById('func-name-badge');
      badge.textContent = result.fns.length
        ? result.fns.slice(0, 2).join(', ') + (result.fns.length > 2 ? ' …' : '')
        : '';
    } catch(e) {
      renderError('Analysis error: ' + e.message);
      console.error(e);
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  }, 30);
}

// ═══════════════════════════════════════════════════════════════
//  EDITOR UTILITIES
// ═══════════════════════════════════════════════════════════════
function updateLineNumbers() {
  const editor = document.getElementById('code-editor');
  const container = document.getElementById('line-numbers');
  const lines = editor.value.split('\n');
  document.getElementById('line-count').textContent = lines.length;

  container.innerHTML = lines.map((_, i) =>
    `<div class="line-num">${i + 1}</div>`
  ).join('');
}

document.getElementById('code-editor').addEventListener('input', () => {
  updateLineNumbers();
  // Sync scroll
  const ed = document.getElementById('code-editor');
  document.getElementById('line-numbers').scrollTop = ed.scrollTop;
});

document.getElementById('code-editor').addEventListener('scroll', () => {
  const ed = document.getElementById('code-editor');
  document.getElementById('line-numbers').scrollTop = ed.scrollTop;
});

// Tab key support
document.getElementById('code-editor').addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const el = e.target;
    const start = el.selectionStart;
    el.value = el.value.substring(0, start) + '  ' + el.value.substring(el.selectionEnd);
    el.selectionStart = el.selectionEnd = start + 2;
    updateLineNumbers();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    runAnalysis();
  }
});

// ── Language tabs ─────────────────────────────────────────────
document.getElementById('lang-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.lang-tab');
  if (!tab) return;
  document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentLang = tab.dataset.lang;
});

// ═══════════════════════════════════════════════════════════════
//  EXAMPLES
// ═══════════════════════════════════════════════════════════════
function buildExamples() {
  const grid = document.getElementById('examples-grid');
  for (const ex of EXAMPLES) {
    const btn = document.createElement('button');
    btn.className = 'example-btn';
    btn.textContent = ex.label;
    btn.onclick = () => {
      // Switch language
      currentLang = ex.lang;
      document.querySelectorAll('.lang-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.lang === ex.lang);
      });
      // Load code
      const editor = document.getElementById('code-editor');
      editor.value = ex.code;
      updateLineNumbers();
      runAnalysis();
    };
    grid.appendChild(btn);
  }
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
buildExamples();

// Load Quick Sort by default
const defaultEx = EXAMPLES[0];
document.getElementById('code-editor').value = defaultEx.code;
updateLineNumbers();

// Kick off analysis immediately
setTimeout(runAnalysis, 200);
</script>
